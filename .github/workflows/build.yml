name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Step 1: verify the platform-independent TS core (offline assertions)
  test-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockpilot-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run core logic tests
        run: node --experimental-strip-types test/logic.test.ts

  # Step 2: Kotlin port verification + build the real app APK
  app-test-and-build:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unit tests (Kotlin port vs golden vectors)
        working-directory: stockpilot-app/android/app
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: stockpilot-app/android/app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: stockpilot-app-apk
          path: stockpilot-app/android/app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: stockpilot-app/android/app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # Step 3: keep the probe APK available (diagnostics: background / notification capability)
  build-probe-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: stockpilot-app/android/probe
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload probe APK
        uses: actions/upload-artifact@v4
        with:
          name: stockpilot-probe-apk
          path: stockpilot-app/android/probe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Build finished" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: stockpilot-app-apk / stockpilot-probe-apk / unit-test-report" >> $GITHUB_STEP_SUMMARY
