name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Step 1: verify the platform-independent core engine (offline assertions)
  test-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockpilot-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run core logic tests
        run: node --experimental-strip-types test/logic.test.ts

  # Step 2: build the probe APK (foreground service / notification / background survival)
  build-probe-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: stockpilot-app/android/probe
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockpilot-probe-apk
          path: stockpilot-app/android/probe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Build finished" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: stockpilot-probe-apk" >> $GITHUB_STEP_SUMMARY
          ls -lh stockpilot-app/android/probe/app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
